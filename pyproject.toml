[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygulp"
version = "0.1.3"
authors = [
    { name = "AIDE Lab", email = "info.aidelab@gmail.com" },
    { name = "Kshitij Vaidya", email = "kshitijvaidya16@gmail.com" },
    { name = "Ishan Pandit", email = "ishanbp12@gmail.com" },
    { name = "Roomani Srivastava", email = "roomani@iitb.ac.in" }
]
description = "Python Package for Goal Linear Programming"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pulp>=2.7.0"
]

[project.urls]
Homepage = "https://github.com/aidelab-iitbombay/PyGuLP"
Documentation = "https://aidelab-iitbombay.github.io/PyGuLP/"

[project.optional-dependencies]

# For visualisation and data handling
viz = [
    "pandas>=1.5.0",
    "matplotlib",
]

# Dependencies for development
dev = [
    "ipython",
    "ipykernel",
    "nbconvert",
    "nbformat",
    "nbsphinx",
    "pandas>=1.5.0",
    "sphinx-rtd-theme",
    "pytest",
    "pytest-cov",
    "black==25.1.0",
    "ruff",
    "mypy",
    "pre-commit",
    "twine",
    "build",
    "sphinx",
]
[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
miniversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.mypy]
packages = ["pygulp"]
strict = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pygulp", "pygulp.*"]
